name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      KERNEL_SOURCE:
        description: 'Kernel source URL'
        required: true
        default: 'https://github.com/aosp-realm/android_kernel_xiaomi_apollo.git'
      KERNEL_BRANCH:
        description: 'Kernel branch'
        required: true
        default: 'main'
      KERNEL_NAME:
        description: 'Kernel/zip name'
        required: true
        default: 'perf'
      CONFIG_FILE:
        description: 'Config file (You can put multiple configs separated by space)'
        required: true
        default: 'apollo_defconfig vendor/debugfs.config'
      TOOLCHAIN_URL:
        description: "Clone URL of your toolchain"
        required: true
        default: 'https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-15.0.0_r1/clang-r522817.tar.gz'
      ANYKERNEL:
        description: "Clone URL of your AnyKernel"
        required: true
        default: 'https://github.com/aosp-realm/AnyKernel3.git -b master'

jobs:
  Build_Kernel:
    runs-on: ubuntu-latest
    permissions: write-all
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}

    steps:
      - name: Set-up environment
        run: |
          rm -rf ${{ github.workspace }}/*
          sudo apt-get update
          sudo apt-get install -y build-essential bc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libfl-dev \
            curl git ftp lftp wget libarchive-tools ccache python-is-python3 zip unzip tar gzip bzip2 rar unrar cpio jq

      - name: Cloning Kernel Source
        run: |
          git clone --single-branch --depth=1 --no-tags ${{ github.event.inputs.KERNEL_SOURCE }} -b ${{ github.event.inputs.KERNEL_BRANCH }} ${{ github.workspace }}/kernel
          echo "COMMIT_ID=$(git -C ${{ github.workspace }}/kernel rev-parse HEAD)" >> $GITHUB_ENV

      - name: Set-up Toolchain
        run: |
          mkdir -p ${{ github.workspace }}/toolchain
          if [[ "${{ github.event.inputs.TOOLCHAIN_URL }}" == *.tar.gz ]]; then
              wget -O clang-toolchain.tar.gz "${{ github.event.inputs.TOOLCHAIN_URL }}"
              tar -xzf clang-toolchain.tar.gz -C ${{ github.workspace }}/toolchain
              rm -f clang-toolchain.tar.gz
          else
              git clone --single-branch --depth=1 --no-tags ${{ github.event.inputs.TOOLCHAIN_URL }} ${{ github.workspace }}/toolchain
          fi

      - name: Set environment variables
        run: |
          echo "OBJDIR=${{ github.workspace }}/kernel/out" >> $GITHUB_ENV
          echo "ANYKERNEL=${{ github.workspace }}/anykernel" >> $GITHUB_ENV
          echo "CLANG_DIR=${{ github.workspace }}/toolchain" >> $GITHUB_ENV
          echo "KERNEL_NAME=${{ github.event.inputs.KERNEL_NAME }}" >> $GITHUB_ENV
          echo "ZIP_NAME=${{ github.event.inputs.KERNEL_NAME }}-$(date +'%d%m%Y').zip" >> $GITHUB_ENV
          echo "OUTPUT_DIR=${{ github.workspace }}/compiled" >> $GITHUB_ENV

          KERNEL_SOURCE_URL="${{ github.event.inputs.KERNEL_SOURCE }}"
          if [[ "${KERNEL_SOURCE_URL}" == *.git ]]; then
            KERNEL_SOURCE_URL="${KERNEL_SOURCE_URL%.git}"
          fi
          echo "KERNEL_SOURCE_URL=${KERNEL_SOURCE_URL}" >> $GITHUB_ENV

      - name: Start Compilation
        run: |
          mkdir -p "${{ env.OUTPUT_DIR }}"
          cd ${{ github.workspace }}/kernel

          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          start=$(date +"%s")

          # make defconfig(s)
          make -s ARCH=arm64 O=${{ env.OBJDIR }} ${{ github.event.inputs.CONFIG_FILE }} -j$(nproc --all)

          # build
          make -j$(nproc --all) \
            O=${{ env.OBJDIR }} \
            ARCH=arm64 \
            CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            AR=llvm-ar \
            LLVM_NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            LD=ld.lld NM=llvm-nm \
            LLVM=1 \
            LLVM_IAS=1

          end=$(date +"%s")
          echo "BUILD_COMPLETED_SECONDS=$((end - start))" >> $GITHUB_ENV
          echo "BUILD_COMPLETED_IN=${{ env.BUILD_COMPLETED_SECONDS }} seconds"

      - name: Collect compiled outputs and prepare AnyKernel
        run: |
          set -euo pipefail
          OBJ="${{ env.OBJDIR }}"
          OUT="${{ env.OUTPUT_DIR }}"
          ANYKERNEL_DIR="${{ env.ANYKERNEL }}"

          mkdir -p "${OUT}"
          # clone anykernel
          git clone -q ${{ github.event.inputs.ANYKERNEL }} "${ANYKERNEL_DIR}"

          # make dtb search list
          wanted_dtbs=(sm8150-xiaomi.dtb sm8150p-xiaomi.dtb sm8150p-v2-xiaomi.dtb sm8150-v2-xiaomi.dtb)

          # Copy kernel images (try multiple possibilities)
          # prefer Image, then Image.gz, then Image.gz-dtb
          if [[ -f "${OBJ}/arch/arm64/boot/Image" ]]; then
            cp -f "${OBJ}/arch/arm64/boot/Image" "${OUT}/Image" || true
            cp -f "${OBJ}/arch/arm64/boot/Image" "${ANYKERNEL_DIR}/Image" || true
          fi

          if [[ -f "${OBJ}/arch/arm64/boot/Image.gz" ]]; then
            cp -f "${OBJ}/arch/arm64/boot/Image.gz" "${OUT}/Image.gz" || true
            cp -f "${OBJ}/arch/arm64/boot/Image.gz" "${ANYKERNEL_DIR}/Image.gz" || true
          fi

          if [[ -f "${OBJ}/arch/arm64/boot/Image.gz-dtb" ]]; then
            cp -f "${OBJ}/arch/arm64/boot/Image.gz-dtb" "${OUT}/Image.gz-dtb" || true
            cp -f "${OBJ}/arch/arm64/boot/Image.gz-dtb" "${ANYKERNEL_DIR}/Image.gz-dtb" || true
          fi

          # dtbo
          if [[ -f "${OBJ}/arch/arm64/boot/dtbo.img" ]]; then
            cp -f "${OBJ}/arch/arm64/boot/dtbo.img" "${OUT}/dtbo.img" || true
            cp -f "${OBJ}/arch/arm64/boot/dtbo.img" "${ANYKERNEL_DIR}/dtbo.img" || true
          fi

          # helper: find and copy DTBs (search multiple likely locations)
          copy_dtb_if_found() {
            local dtbname="$1"
            # search common dirs under kernel tree and object dir
            # prioritize compiled dtbs close to OBJ/arch/arm64/boot/dts
            candidates=(
              "${OBJ}/arch/arm64/boot/dts/vendor/qcom/${dtbname}"
              "${OBJ}/arch/arm64/boot/dts/qcom/${dtbname}"
              "${OBJ}/arch/arm64/boot/dts/${dtbname}"
              "${OBJ}/arch/arm64/boot/dtb/${dtbname}"
              "${{ github.workspace }}/kernel/arch/arm64/boot/dts/vendor/qcom/${dtbname}"
              "${{ github.workspace }}/kernel/arch/arm64/boot/dts/qcom/${dtbname}"
              "${{ github.workspace }}/kernel/arch/arm64/boot/dts/${dtbname}"
            )
            for p in "${candidates[@]}"; do
              if [[ -f "$p" ]]; then
                mkdir -p "${OUT}"
                mkdir -p "${ANYKERNEL_DIR}/dtbs"
                cp -f "$p" "${OUT}/${dtbname}" || true
                cp -f "$p" "${ANYKERNEL_DIR}/dtbs/${dtbname}" || true
                echo "Found and copied ${dtbname} from $p"
                return 0
              fi
            done

            # fallback: find anywhere under kernel tree / object dir
            found="$(find "${OBJ}" "${{ github.workspace }}/kernel" -type f -name "${dtbname}" 2>/dev/null | head -n1 || true)"
            if [[ -n "${found}" ]]; then
              cp -f "${found}" "${OUT}/${dtbname}" || true
              cp -f "${found}" "${ANYKERNEL_DIR}/dtbs/${dtbname}" || true
              echo "Found and copied ${dtbname} from ${found}"
              return 0
            fi

            echo "WARNING: ${dtbname} not found"
            return 1
          }

          # try all requested dtbs
          for dtb in "${wanted_dtbs[@]}"; do
            copy_dtb_if_found "${dtb}" || true
          done

          # Also copy any other dtb from vendor qcom dir to release (non-fatal)
          if ls "${OBJ}/arch/arm64/boot/dts/vendor/qcom/"*.dtb 1> /dev/null 2>&1; then
            mkdir -p "${OUT}/qcom_dtbs"
            cp -f "${OBJ}/arch/arm64/boot/dts/vendor/qcom/"*.dtb "${OUT}/qcom_dtbs/" || true
          fi

          # Ensure AnyKernel contains at least one kernel image for flashing
          # If AnyKernel expects "Image", provide it; if only gz-dtb exists, include it as well.
          # (We already copied any found images above.)

          # Create AnyKernel.zip
          cd "${ANYKERNEL_DIR}"
          # include dtbs folder content in zip by keeping them in the repo dir
          zip -r AnyKernel.zip . -q
          mv AnyKernel.zip "${OUT}/${{ env.ZIP_NAME }}" || true

          # output listing for debugging
          echo "Compiled output folder content:"
          ls -al "${OUT}" || true

          echo "RELEASE_DATE=$(date +'%B %-d, %Y %H:%M')" >> $GITHUB_ENV
          echo "ZIP_NAME=${{ env.ZIP_NAME }}" >> $GITHUB_ENV

      - name: Upload files to repository releases page
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ env.OUTPUT_DIR }}/*
          name: ${{ github.event.inputs.KERNEL_NAME }} // ${{ env.RELEASE_DATE }}
          tag_name: ${{ github.run_id }}
          body: |
            [Kernel Source](${{ env.KERNEL_SOURCE_URL }}/tree/${{ github.event.inputs.KERNEL_BRANCH }})
            [Latest Commit](${{ env.KERNEL_SOURCE_URL }}/commit/${{ env.COMMIT_ID }})
            Build finished on ${{ env.RELEASE_DATE }}
